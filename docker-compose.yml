name: hackathon

# Основной запуск:
#   docker compose up -d --build
# Kafka и воркеры удалены: событийная шина не нужна сервису документов.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --timeout-keep-alive 120
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      stt_service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  stt_service:
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    container_name: hackathon_stt
    ports:
      - "8200:8200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  db:
    image: postgres:17-alpine
    container_name: hackathon_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon_migrate
    env_file:
      - .env
    volumes:
      - .:/app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    container_name: hackathon_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ml_service:
    build:
      # Dockerfile ML-сервиса написан под контекст самой папки
      # (COPY requirements.txt ./, COPY src ./src, COPY artifacts ./artifacts).
      # С context: . сборка брала бы корневые файлы бэкенда и падала на artifacts.
      context: ./ml_service
      dockerfile: Dockerfile
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      OLLAMA_TIMEOUT_SECONDS: "90"
      FALLBACK_ENABLED: "true"
      MODEL_PATH: artifacts/model.joblib
    volumes:
      # Переобучил модель на хосте -> docker compose restart ml_service, без пересборки.
      - ./ml_service/artifacts:/app/artifacts
    depends_on:
      - ollama

volumes:
  postgres_data:
  redis_data:
  ollama_models: