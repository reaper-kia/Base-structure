name: doc3

# Локальный запуск:
#   cp .env.example .env && docker compose up -d --build
#   make pull-model          # один раз: ~6 ГБ весов в том ollama_models
#
# MAX-бот не входит в базовый стек: он требует токена и внешней сети.
#   docker compose --profile bot up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc3_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --timeout-keep-alive 120
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc3_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      stt_service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Распознавание речи (голосовой ввод черновика). Локальная модель Vosk,
  # без внешних API — критерий «использование платного и проприетарного ПО».
  stt_service:
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    container_name: doc3_stt
    ports:
      - "8200:8200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  db:
    image: postgres:17-alpine
    container_name: doc3_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doc3_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc3_migrate
    env_file:
      - .env
    volumes:
      - .:/app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    container_name: doc3_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ml_service:
    # Dockerfile ML-сервиса написан под контекст своей папки
    # (COPY requirements.txt ./, COPY src ./src).
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: doc3_ml
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      OLLAMA_TIMEOUT_SECONDS: "90"
      FALLBACK_ENABLED: "true"
      RAG_ENABLED: "${RAG_ENABLED:-true}"
      RAG_VECTOR_ENABLED: "${RAG_VECTOR_ENABLED:-true}"
      RAG_EMBED_MODEL: "${RAG_EMBED_MODEL:-bge-m3}"
      RAG_EMBED_TIMEOUT_SECONDS: "${RAG_EMBED_TIMEOUT_SECONDS:-15}"
      RAG_EMBED_KEEP_ALIVE: "0"
      RAG_TOP_K: "${RAG_TOP_K:-3}"
      RAG_MIN_SCORE: "${RAG_MIN_SCORE:-0.2}"
      RAG_MAX_CONTEXT_CHARS: "${RAG_MAX_CONTEXT_CHARS:-3000}"
      RAG_KNOWLEDGE_DIR: /app/knowledge
    volumes:
      # Справочники можно обновлять локально без пересборки образа.
      - ./ml_service/knowledge:/app/knowledge:ro
    ports:
      - "8100:8100"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Бот в мессенджере MAX — альтернативный канал того же сценария.
  # Отдельный профиль: без токена он не стартует, и базовый стек об этом
  # знать не обязан.
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: doc3_bot
    profiles: ["bot"]
    env_file:
      - bot/.env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_models:
