name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Lint + Tests + Real Generator)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379/0
      # Отключаем реальный ИИ в тестах, чтобы не ходить в сеть.
      # Тесты, которым нужен ЛЛМ, используют подмены (фэйки).
      ML_SERVICE_URL: ""
      APP_ENV: test
      # Кэш на 0 секунд, чтобы тесты не зависели от случайных попаданий.
      CACHE_TTL_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v

      # Сохраняем сгенерированные .docx при падении тестов генератора,
      # чтобы B2 мог скачать их и увидеть дефект глазами (критерий 4.4).
      - name: Upload failed DOCX artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-docx-artifacts
          path: artifacts/
          if-no-files-found: ignore

  ml-service:
    name: ML Service (Lint + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # ruff не входит в requirements.txt ML-сервиса, ставим явно,
          # чтобы линт не падал и не пропускался молча.
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build