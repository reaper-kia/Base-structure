name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    # Тесты подменяют внешние зависимости и работают на фейках,
    # поэтому отдельные PostgreSQL/Redis-контейнеры в CI не требуются.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379/0
      # Пустая строка = реального ИИ в тестах нет.
      ML_SERVICE_URL: ""
      APP_ENV: test
      # Кэш на 0 секунд, чтобы тесты не зависели от случайных попаданий.
      CACHE_TTL_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Run tests
        run: pytest tests/ -v

      - name: Generate reference DOCX samples
        run: python scripts/make_docx_samples.py

      # Восемь эталонных файлов (4 типа x 2 шаблона) — материал для защиты
      # и способ увидеть дефект оформления глазами (критерий 4.4).
      - name: Upload DOCX samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docx-samples
          path: artifacts/
          if-no-files-found: ignore

  ml-service:
    name: ML service (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      # Ollama в CI нет — прогон идёт по ветке резервной обработки.
      # Это самый строгий случай: гарантии контракта проверяются там,
      # где модели не существует.
      - name: Run tests
        run: pytest

  stt-service:
    name: STT service (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            stt-service/requirements.txt
            stt-service/requirements.test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt

      - name: Lint
        run: ruff check app/ tests/

      # Вес модели не нужен: распознаватель подменён, а разбор плохого WAV
      # отдельно проверяется до вызова Vosk.
      - name: Run tests
        run: pytest tests/ -v

  bot:
    name: MAX bot (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          VITE_USE_MOCK: "true"

      - name: Build
        run: npm run build
