x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Боевой стек. Запуск:
#   cp .env.example .env.prod && отредактировать секреты и ORG_NAME
#   docker compose -f compose.prod.yml up -d --build
#   docker compose -f compose.prod.yml exec ollama ollama pull qwen2.5:7b-instruct
#   docker compose -f compose.prod.yml exec ollama ollama pull bge-m3
#
# MAX-бот подключается отдельным профилем:
#   docker compose -f compose.prod.yml --profile bot up -d

services:
  app:
    mem_limit: 250m
    cpus: 0.75
    pids_limit: 200
    build:
      context: .
      dockerfile: Dockerfile.prod
    logging: *default-logging
    container_name: doc3_app
    env_file:
      - .env.prod
    environment:
      ML_SERVICE_URL: http://ml_service:8100
      USER_TEMPLATES_DIR: /app/data/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml_service:
        condition: service_healthy
    command:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Единственный каталог, доступный приложению на запись: сюда
      # складываются загруженные пользователем шаблоны. Остальной образ
      # остаётся read-only.
      - prod_user_templates:/app/data/templates
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - edge
      - backend

  frontend:
    mem_limit: 150m
    cpus: 0.25
    pids_limit: 200
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    container_name: doc3_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      stt_service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge
      - speech

  stt_service:
    mem_limit: 500m
    cpus: 1.0
    pids_limit: 100
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    logging: *default-logging
    container_name: doc3_stt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - speech

  db:
    mem_limit: 350m
    cpus: 0.75
    pids_limit: 200
    image: postgres:17-alpine
    container_name: doc3_db
    logging: *default-logging
    env_file:
      - .env.prod
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    mem_limit: 100m
    cpus: 0.25
    pids_limit: 100
    image: redis:7-alpine
    logging: *default-logging
    container_name: doc3_redis
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: doc3_migrate
    env_file:
      - .env.prod
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 200m
    cpus: 0.50
    pids_limit: 100
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  ollama:
    mem_limit: 6g
    cpus: 3.9 
    pids_limit: 200
    image: ollama/ollama:latest
    container_name: doc3_ollama
    logging: *default-logging
    volumes:
      - prod_ollama_models:/root/.ollama
    # Порт наружу не публикуется: модель доступна только из сети backend.
    # Открытый 11434 — это незащищённый endpoint генерации на публичном IP.
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  ml_service:
    mem_limit: 500m
    cpus: 0.5
    pids_limit: 100
    # Контекст — папка сервиса: его Dockerfile ожидает requirements.txt и
    # src/ в корне контекста. С context: . сборка брала бы файлы бэкенда.
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: doc3_ml
    logging: *default-logging
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      OLLAMA_TIMEOUT_SECONDS: "220"
      FALLBACK_ENABLED: "true"
      RAG_ENABLED: "true"
      RAG_VECTOR_ENABLED: "true"
      RAG_EMBED_MODEL: bge-m3
      RAG_EMBED_TIMEOUT_SECONDS: "15"
      # Embedding-модель выгружается до запуска тяжёлой 7B-генерации.
      RAG_EMBED_KEEP_ALIVE: "0"
      RAG_TOP_K: "3"
      RAG_MIN_SCORE: "0.2"
      RAG_MAX_CONTEXT_CHARS: "3000"
      RAG_KNOWLEDGE_DIR: /app/knowledge
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Проверяем /health, а не /health/model: сервис работоспособен в режиме
      # деградации и без модели, перезапускать его за это нельзя.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - backend

  bot:
    mem_limit: 150m
    cpus: 0.25
    pids_limit: 100
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: doc3_bot
    profiles: ["bot"]
    logging: *default-logging
    env_file:
      - bot/.env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # edge нужен для исходящих запросов к API мессенджера,
      # backend — чтобы дойти до app:8000.
      - edge
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
  speech:
    driver: bridge
    internal: true

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_ollama_models:
  prod_user_templates:
