name: "Классический корпоративный"
description: "Традиционное деловое оформление для официальной переписки и внутренних документов"

page:
  top_mm: 20
  bottom_mm: 20
  left_mm: 30
  right_mm: 15

font:
  family: "Times New Roman"
  size_pt: 14

spacing:
  line: 1.5
  first_line_indent_cm: 1.25
  space_after_pt: 0

alignment: justify

header_footer:
  header:
    text: "[Название организации]"
    font_family: "Times New Roman"
    font_size_pt: 11
  footer:
    text: "Страница {page}"
    font_family: "Times New Roman"
    font_size_pt: 11

requisites_layout:
  - {key: addressee, position: top_right}
  - {key: date, position: top_left}
  - {key: reg_number, position: top_left}
  - {key: subject, position: center, bold: true}
  - {key: body, position: body}
  - {key: author_position, position: bottom_left}
  - {key: author, position: bottom_left}