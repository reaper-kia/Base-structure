# Шаблон A «Классический корпоративный».
# Источник параметров — «Описание шаблонов оформления.docx» организаторов
# (docs/organizer-materials/шаблоны/), раздел «ШАБЛОН A».
name: "Классический корпоративный"
description: "Традиционное деловое оформление: Times New Roman 14, поля 30/15/20/20 мм, интервал 1.5, красная строка 1.25 см"

page:
  top_mm: 20
  bottom_mm: 20
  left_mm: 30
  right_mm: 15

font:
  family: "Times New Roman"
  size_pt: 14

spacing:
  line: 1.5
  first_line_indent_cm: 1.25
  space_after_pt: 0

alignment: justify

header_footer:
  # «Верхний — название организации». Значение берётся из настройки
  # ORG_NAME; если её не задали, в документе останется явная пометка
  # незаполненного реквизита — выдумывать название организации нельзя.
  header:
    text: "{org_name}"
    font_family: "Times New Roman"
    font_size_pt: 11
  # «Нижний — номер страницы».
  footer:
    text: "Страница {page}"
    font_family: "Times New Roman"
    font_size_pt: 11

# «Шапка справа — стиль «Адресат». Дата и номер сверху — стиль «Подпись1».
# Заголовок — стиль «Заголовок». Подпись слева.»
requisites_layout:
  - {key: addressee, position: top_right}
  - {key: author, position: top_right}
  - key: date_number
    type: line
    position: top_left
    parts:
      - {label: "Дата:", key: doc_date}
      - {label: "Номер:", key: reg_number}
  - {key: doc_title, type: doc_title, position: center, bold: true}
  - {key: subject, position: center, bold: true}
  - {key: salutation, position: left}
  - {key: body, position: body}
  - key: signature_block
    type: signature
    position: bottom_left
    keys: [position, signature]
  - {key: executor, position: bottom_left, font_size_pt: 10}
