name: "Современный регламентный"
description: "Лаконичное оформление с табличной шапкой, подходит для регламентов, справок и писем"

page:
  top_mm: 15
  bottom_mm: 15
  left_mm: 25
  right_mm: 20

font:
  family: "Arial"
  size_pt: 12

spacing:
  line: 1.15
  first_line_indent_cm: 0
  space_after_pt: 0

alignment: left

header_footer:
  header:
    text: ""
  footer:
    text: "{subject} | {date}"
    font_family: "Arial"
    font_size_pt: 10

requisites_layout:
  - {key: subject, position: top_left, bold: true}
  - key: address_table
    type: table
    position: top_left
    rows:
      - {label: "Кому:", value_key: "addressee"}
      - {label: "От кого:", value_key: "author"}
  - {key: body, position: body}
  - {key: author_position, position: bottom_center}
  - {key: author, position: bottom_center}