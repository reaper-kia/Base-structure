# Шаблон B «Современный регламентный».
# Источник параметров — «Описание шаблонов оформления.docx» организаторов
# (docs/organizer-materials/шаблоны/), раздел «ШАБЛОН B».
name: "Современный регламентный"
description: "Лаконичное оформление: Arial 12, поля 25/20/15/15 мм, интервал 1.15, таблица-шапка «Кому / От кого»"

page:
  top_mm: 15
  bottom_mm: 15
  left_mm: 25
  right_mm: 20

font:
  family: "Arial"
  size_pt: 12

spacing:
  line: 1.15
  first_line_indent_cm: 0
  space_after_pt: 0

alignment: left

header_footer:
  # «Верхний — отсутствует».
  header:
    text: ""
  # «Нижний — название документа и дата».
  footer:
    text: "{subject} | {doc_date}"
    font_family: "Arial"
    font_size_pt: 10

# «Тема сверху слева. Блок «Кому / От кого» — таблица.
# Подпись по центру.»
requisites_layout:
  - {key: doc_title, type: doc_title, position: top_left, bold: true}
  - {key: subject, position: top_left, bold: true}
  - key: address_table
    type: table
    position: top_left
    rows:
      - {label: "Кому:", value_key: addressee}
      - {label: "От кого:", value_key: author}
  - key: date_number
    type: line
    position: top_left
    parts:
      - {label: "Дата:", key: doc_date}
      - {label: "Номер:", key: reg_number}
  - {key: salutation, position: left}
  - {key: body, position: body}
  - key: signature_block
    type: signature
    position: bottom_center
    keys: [position, signature]
  - {key: executor, position: bottom_center, font_size_pt: 10}
