server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Docker может выдать сервису новый IP после пересоздания контейнера.
    # Переменная в proxy_pass заставляет Nginx обновлять адрес через
    # встроенный DNS Docker, не требуя перезапуска frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:8000;
    set $stt_upstream stt_service:8200;

    # Бэкенд документов.
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://$app_upstream;
        include /etc/nginx/proxy_params.conf;
        # Multipart добавляет служебные байты сверх лимита файла FastAPI (10 МБ).
        client_max_body_size 11m;
    }

    # Распознавание речи — отдельный сервис. Аудио до 20 МБ, распознавание
    # на CPU идёт дольше стандартных 60 секунд.
    location = /stt {
        proxy_pass http://$stt_upstream;
        include /etc/nginx/proxy_params.conf;
        client_max_body_size 20m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
