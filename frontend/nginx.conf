server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|auth|users|health)(/|$) {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # Only backend admin API requests are proxied. Frontend routes such as
    # /admin/login and /admin/requests must continue to resolve through the SPA.
    location ~ ^/admin/customer-requests(/|$) {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}